[project]
name = "bridge-monitor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic==2.14.1", "fastapi==0.143.2", "psycopg[binary]==3.3.6", "uvicorn==0.54.0", "mcp==1.30.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
