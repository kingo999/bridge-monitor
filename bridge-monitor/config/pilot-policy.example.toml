# Copy within C:\AI\bridge-monitor and replace every REQUIRED value before activation.
# Pilot alone uses one active Claude; bridge-policy.example.toml retains the default of two.
[limits]
claude_global_active = 1
claude_per_root_active = 1
claude_waiting = 8
qwen_active = 1
qwen_waiting = 4
local_outstanding_per_claude = 1
claude_execution_seconds = 900
qwen_execution_seconds = 180

[deployment]
queue_deadline_seconds = 0 # REQUIRED
queue_poll_ms = 200
context_wait_seconds = 0 # REQUIRED
fallback_allowance_tokens = 0 # REQUIRED
fallback_allowance_seconds = 60
client_timeout_seconds = 0 # REQUIRED
delivery_margin_seconds = 0 # REQUIRED
payload_limit_bytes = 0 # REQUIRED
spool_limit_bytes = 0 # REQUIRED
spool_overflow_policy = "reject_new_work"
degraded_admission = "reject_new_work"
retention_days = 0 # REQUIRED
postgres_dsn_ref = "env:BRIDGE_MONITOR_DSN"
qwen_endpoint = "http://192.168.0.78:11434"
qwen_model_profile = "qwen2.5-coder:14b-instruct-q4_K_M"
qwen_model_digest = "9ec8897f747e246e970bc5cfdda85d22f1123dc2e3d34978a010a75968716849"
qwen_output_tokens = 2048
qwen_keep_alive = "10m"
qwen_temperature = 0.0

[fallback]
paid_model_profile = "sonnet" # Selected Claude worker CLI alias; verify reported model before live admission.

[review]
reviewer = "REQUIRED"
approval_reference = "REQUIRED"
