# Copy within this project and replace each REQUIRED value before live admission.
# A secret reference is resolved by the process environment, not stored in events.
[limits]
claude_global_active = 2
claude_per_root_active = 2
claude_waiting = 8
qwen_active = 1
qwen_waiting = 4
local_outstanding_per_claude = 1
claude_execution_seconds = 900
qwen_execution_seconds = 180

[deployment]
queue_deadline_seconds = 0 # REQUIRED: choose for your client deadline
queue_poll_ms = 200
context_wait_seconds = 0 # REQUIRED
fallback_allowance_tokens = 0 # REQUIRED
fallback_allowance_seconds = 60
client_timeout_seconds = 0 # REQUIRED
delivery_margin_seconds = 0 # REQUIRED
payload_limit_bytes = 0 # REQUIRED
spool_limit_bytes = 0 # REQUIRED
spool_overflow_policy = "reject_new_work"
degraded_admission = "reject_new_work"
retention_days = 0 # REQUIRED
postgres_dsn_ref = "env:BRIDGE_MONITOR_DSN"
qwen_endpoint = "REQUIRED"
qwen_model_profile = "REQUIRED"
qwen_model_digest = "REQUIRED"
qwen_output_tokens = 2048
qwen_keep_alive = "10m"
qwen_temperature = 0.0

[fallback]
paid_model_profile = "REQUIRED"

[guidance]
# Empty baseline: approved pack references are added only after registration
# and a hash-specific human review of this policy file.
packs = []
required_categories = []
max_bytes = 0

[review]
reviewer = "REQUIRED"
approval_reference = "REQUIRED"
