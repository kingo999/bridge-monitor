
[listen]
host = "127.0.0.1"
port = 8873
tls_cert_path = ""
tls_key_path = ""

[operator]
credential_env = "BRIDGE_MONITOR_OPERATOR_TOKEN"
session_ttl_seconds = 3600
# Enable only in a private local config bound to 127.0.0.1 for browser testing.
local_test_login = false

[capture]
dsn_env = "BRIDGE_MONITOR_DSN"
producer_tokens_env = "BRIDGE_MONITOR_PRODUCER_TOKENS_JSON"
payload_limit_bytes = 1048576
subscription_producer_ids = ["claude-subscription-statusline"]

[dashboard]
export_dir = "dashboard/out"
preview_max_chunks = 80
preview_max_bytes = 16384
timeline_head_events = 100
timeline_tail_events = 400
work_item_max_limit = 1000
# Optional Design Mode "Awaiting my decision" filter (single-operator display preference, not
# authorization). Copy your exact owner_id from a Design Mode workflow detail (format
# "<producer_id>@<OS account>") and uncomment. Matching is exact and case-sensitive; a typo
# matches nothing. To disable, leave the line commented out: an empty, whitespace-only or
# whitespace-padded value is invalid and stops startup (unlike tls_cert_path = "").
# design_mode_owner_id = "<producer_id>@<OS account>"
